# Jev category prompts. Multiple categories may apply to one request.
# Shared scope and control questions: routing.toml. Models: profiles.toml.
version = "3.1"

[categories.ui_style]
domain = "ui"
owner = "interface"
title = "Existing interface styling"
question = "Is styling an existing interface part of the requested work?"
yes = "Colors, typography, contrast, spacing, borders, shadows, icons or visual states of existing elements. Includes reviewing or explaining those styles."
no = "Only new layout, interaction behavior or server work. A new component's ordinary styling is not a separate restyling deliverable."
positive_examples = ["Сделай фон светлее, остальное не трогай.", "Improve contrast in the existing cards.", "Explain why this CSS color is not applied."]
negative_examples = ["The button does not submit.", "Add a sidebar in the existing theme.", "Document our color tokens in README."]
profile_notes = "One exact property: mechanical. Several coordinated styles: bounded. A theme across screens and states: feature work. Conflicting accessibility constraints: constraint-heavy."

[categories.ui_layout]
domain = "ui"
owner = "interface"
title = "Layout and visual components"
question = "Does the request concern a new or restructured visual layout or user journey?"
yes = "Screens, panels, modals, card arrangements, responsive composition, hierarchy or interaction design. Static implementation of a mockup counts."
no = "Only restyling existing elements, event handling, API binding or system architecture. A database table is not a UI layout."
positive_examples = ["Сверстай панель справа, данные пока заглушки.", "Build this screen from the mockup.", "Review the mobile registration layout."]
negative_examples = ["Only change the background.", "Fix the handler opening the existing modal.", "Design a database schema."]
profile_notes = "Adapt one supplied component: bounded. Compose a new responsive screen: feature work. Resolve interacting layout and accessibility constraints: constraint-heavy."

[categories.frontend_logic]
domain = "frontend"
owner = "interface"
title = "Client-side behavior"
question = "Does the request concern client behavior beyond routine API request handling?"
yes = "Client state, event handlers, navigation, keyboard behavior, local validation, filtering, sorting or calculations. Include a distinct local behavior alongside API integration."
no = "Appearance alone, server code, or loading/error states that are only part of an API binding. React or Next.js alone does not establish client work."
positive_examples = ["Кнопка должна открывать готовое окно.", "Remember filters when navigating back.", "Find the cause of this React render loop."]
negative_examples = ["Make the button green.", "Add a Next.js server route.", "Fetch the list and display loading/error states."]
profile_notes = "Known handler: bounded. Connected local states: feature work. Races, hydration or difficult rendering dependencies: constraint-heavy."

[categories.frontend_api]
domain = "frontend"
owner = "interface"
title = "Client API integration"
question = "Does the request concern connecting a UI to a server API?"
yes = "Fetching or submitting data, response/loading states, invalidation, optimistic updates or client subscriptions. A working UI plus its new API includes the binding."
no = "Static mockups, server-only endpoints, or merely mentioning an existing API. Do not infer server changes from client integration."
positive_examples = ["Подключи готовый GET /cards к таблице.", "Build a working cards panel and its create/list API.", "Refresh the list after saving."]
negative_examples = ["Only restyle the page; the API works.", "Use mock cards; connect the API later.", "Implement GET /cards, leave the client alone."]
profile_notes = "One binding to a fixed contract: bounded. A new fetch/save workflow: feature work. Offline sync or conflicting optimistic updates: constraint-heavy."

[categories.backend_api]
domain = "backend"
owner = "server"
title = "Server API and handlers"
question = "Does the request concern server endpoints, API contracts or request handlers?"
yes = "HTTP/RPC routes, request/response schemas, server validation, status codes, webhook receivers and ordinary CRUD. Includes endpoint diagnosis or explanation."
no = "Only consuming an API, database-only changes or deployment. An unchanged server mentioned as context is not server work."
positive_examples = ["Создай API создания и списка карточек.", "Add pagination to GET /users.", "Explain why this FastAPI endpoint returns 500."]
negative_examples = ["Connect the ready API without changing it.", "Change only the database index.", "Containerize the unchanged API."]
profile_notes = "Known response-field edit: bounded. Conventional CRUD: feature work. Explicit compatibility, authorization or idempotency constraints: constraint-heavy."

[categories.backend_logic]
domain = "backend"
owner = "server"
title = "Business rules and server processes"
question = "Is a distinct server business rule, calculation or background process requested?"
yes = "Business calculations, permissions, state transitions, jobs, queues, scheduling or consistency rules beyond ordinary endpoint plumbing."
no = "Routine CRUD glue, client behavior, deployment of an unchanged worker, or AI-specific behavior without a separate server requirement."
positive_examples = ["Редактировать карточку может только автор.", "Make job reprocessing idempotent.", "Calculate discounts from status and order history."]
negative_examples = ["Expose the existing service through GET /cards.", "Deploy the finished worker.", "Change only the tool-selection prompt."]
profile_notes = "One specified rule: bounded. A conventional process: feature work. Concurrency, transactions and complex authorization: constraint-heavy."

[categories.database]
domain = "database"
owner = "server"
title = "Persistence and database queries"
question = "Is work on database structures, queries or stored data requested?"
yes = "Schema, migrations, SQL, indexes, query plans, locking, integrity, persistence interfaces, backfills or recovery."
no = "Saving through an unchanged repository, a visual table, database container networking, or a feature with no established persistence change."
positive_examples = ["Добавь таблицу cards и миграцию.", "Optimize this SQL using EXPLAIN ANALYZE.", "Backfill live data without long locks."]
negative_examples = ["Use the existing repository unchanged.", "Restyle the users table on screen.", "Expose the PostgreSQL container port."]
profile_notes = "Known reversible query edit: bounded. Conventional migration: feature work. Live data loss, locking or recovery constraints: constraint-heavy even with little SQL."

[categories.devops]
domain = "infrastructure"
owner = "infrastructure"
title = "Infrastructure and deployment"
question = "Does the request concern runtime infrastructure or deployment?"
yes = "Containers, delivery pipelines, cloud resources, proxies, DNS/TLS, services, environment configuration, operational monitoring, scaling or recovery."
no = "Application bugs merely seen in container logs, local developer commands, worker business logic or database query design."
positive_examples = ["Настрой Compose для готового API.", "Configure nginx for WebSocket.", "Add rolling deployment and rollback."]
negative_examples = ["Fix the discount formula shown in container logs.", "How do I exit git log?", "Write the worker business rules."]
profile_notes = "Known local setting: bounded. Standard deployment: feature work. Concrete availability, access or rollback risks: constraint-heavy."

[categories.ai_ml]
domain = "ai_ml"
owner = "ai"
title = "AI behavior and evaluation"
question = "Is AI behavior itself the subject of the requested work?"
yes = "Prompts, classifier criteria, model calls, tool selection, agent orchestration, retrieval, embeddings, inference, training or AI evaluations."
no = "Using Codex to code, styling an AI app, consuming a ready chat API, deploying an unchanged model or fixing a non-AI parser."
positive_examples = ["Улучши классификацию UI и backend в Jev.", "Fix the agent's tool selection.", "Evaluate retrieval against labeled cases."]
negative_examples = ["Codex, lighten the chat background.", "Restart the unchanged inference container.", "Fix this regex parser without AI."]
profile_notes = "Exact parameter edit: bounded. Conventional AI component: feature work. Interacting retrieval, orchestration and evaluation constraints: constraint-heavy."

[categories.testing]
domain = "testing"
owner = "verification"
title = "Explicit testing deliverables"
question = "Are tests or a separate verification report explicitly requested?"
yes = "Create, fix or run specified tests; fixtures, mocks, coverage, load scenarios or a reproducible verification report."
no = "Routine checking implied by implementation, examples in documentation, or tests deferred by the request. A testing label does not require a separate agent."
positive_examples = ["Исправь баг и добавь регрессионный тест.", "Add integration tests for the API.", "Run the load scenario and report measurements."]
negative_examples = ["Change the background.", "Implement it; tests later.", "Document the API."]
profile_notes = "Known test pattern: bounded. Integration fixtures: feature work. Nondeterminism, concurrency or difficult invariants: constraint-heavy."

[categories.security]
domain = "security"
owner = "security"
title = "Security-specific engineering"
question = "Is security analysis or remediation an explicit objective?"
yes = "Vulnerabilities, threat modeling, injection, authorization bypass, leaked secrets, cryptographic design, isolation or security hardening."
no = "Routine login using an existing pattern, a product handling sensitive data, or a standard deployment without a security-specific objective."
positive_examples = ["Проверь endpoint на SQL injection.", "Fix the tenant authorization bypass.", "Threat-model credential storage."]
negative_examples = ["Add login following the existing pattern.", "Change dashboard colors.", "Use existing auth; audit is out of scope."]
profile_notes = "Known remediation: feature work. Access boundaries and exploit paths: constraint-heavy. Expert profiles need a specific unresolved hard decision."

[categories.architecture]
domain = "architecture"
owner = "architecture"
title = "System design decisions"
question = "Is a system-level design decision itself a requested deliverable?"
yes = "Module/service boundaries, system responsibilities, architecture alternatives, cross-service contracts or consistency choices."
no = "Routine implementation, local refactoring, several files, ordinary UI-plus-API work or a visual page layout."
positive_examples = ["Сравни монолит и сервисы для этих требований.", "Choose service boundaries and justify tradeoffs.", "Design consistency across five services."]
negative_examples = ["Add an endpoint using the existing architecture.", "Build a panel and ordinary CRUD API.", "Design the dashboard layout."]
profile_notes = "Familiar bounded design: feature work. Cross-component constraints: constraint-heavy. Expert profiles require established hard tradeoffs, not the word architecture."

[categories.tooling]
domain = "tooling"
owner = "tooling"
title = "Developer workflow and local tools"
question = "Does the request concern development tools or local workflow?"
yes = "Git, package management, linters, formatters, editor/terminal setup, builds, local project setup or developer automation."
no = "User-facing product behavior merely implemented as a CLI/script, production delivery pipelines or application code edited through a terminal."
positive_examples = ["Настрой Ruff для проекта.", "Explain how to rebase this branch.", "Fix Python packaging for local installation."]
negative_examples = ["Add a customer-facing CLI feature.", "Deploy to production with GitHub Actions.", "Fix billing using your terminal."]
profile_notes = "Exact safe command: mechanical. Known config: bounded. Shared workflow: feature work. Destructive history or complex build constraints need stronger checking."

[categories.documentation]
domain = "documentation"
owner = "documentation"
title = "Technical documentation artifacts"
question = "Is a technical documentation artifact explicitly requested?"
yes = "README, API reference, installation or migration guide, architecture document, code documentation or contributor instructions."
no = "Only a chat explanation, executable AI instructions stored as text, or helpful documentation not actually requested."
positive_examples = ["Напиши инструкцию установки в README.", "Document these endpoints; do not change code.", "Write a contributor guide."]
negative_examples = ["Explain this function in chat.", "Change production classifier criteria.", "Implement the API; no documentation changes."]
profile_notes = "Typo: mechanical. Guide from known sources: bounded. Substantial synthesis: feature work. Unresolved design decisions are a separate category."
